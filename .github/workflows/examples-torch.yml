name: Torch Example Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  torch-example-tests:
    name: Torch Example Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install .

      - name: Run torch example tests
        run: |
          pytest tests/test_examples.py -v --tb=short \
            -k "test_torch_example or test_logistic_regression_pruning_example"
