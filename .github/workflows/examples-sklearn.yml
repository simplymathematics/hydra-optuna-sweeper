name: Sklearn Example Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  sklearn-example-tests:
    name: Sklearn Example Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest scikit-learn
          pip install .

      - name: Run sklearn example tests
        run: |
          pytest tests/test_examples.py -v --tb=short \
            -k "test_sklearn_partial_fit_pruning_example or test_sklearn_cv_pruning_example"
