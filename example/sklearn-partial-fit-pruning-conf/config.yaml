defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe
  - override hydra/sweeper/pruner: median

hydra:
  sweeper:
    sampler:
      seed: 42
    # MedianPruner: prune if the trial's intermediate value is worse than the
    # median of completed trials at the same step.
    pruner:
      n_startup_trials: 2
      n_warmup_steps: 3
      interval_steps: 1
    direction: maximize
    study_name: sklearn-partial-fit-pruning
    storage: sqlite:///sklearn-partial-fit-pruning.db
    n_trials: 20
    n_jobs: 1
    params:
      alpha: interval(1e-5, 1e-1)
      eta0: interval(1e-4, 1e-1)

# Default hyperparameters (overridden by the sweeper during optimisation)
alpha: 1e-4
eta0: 0.01

# Training settings (not swept)
n_epochs: 10
n_features: 20
n_samples: 500
n_classes: 2
seed: 0
