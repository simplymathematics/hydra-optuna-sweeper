defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe
  - override hydra/sweeper/pruner: median

hydra:
  sweeper:
    sampler:
      seed: 42
    # MedianPruner: prune if the trial's intermediate value is worse than the
    # median of completed trials at the same step.
    pruner:
      n_startup_trials: 1
      n_warmup_steps: 2
      interval_steps: 1
    direction: minimize
    study_name: logistic-regression-pruning
    storage: null
    n_trials: 20
    n_jobs: 1
    params:
      lr: interval(1e-4, 1e-1)
      weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2)

# Default hyperparameters (overridden by the sweeper during optimisation)
lr: 0.01
weight_decay: 0.0

# Training settings (not swept)
epochs: 10
n_features: 10
n_samples: 200
seed: 0
